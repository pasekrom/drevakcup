# Příklad: Django STATIC_URL je výchozí "static/" → v prohlížeči jde o cestu /static/...
# Nesedí s location /static/django/ — buď přejmenuj location na /static/, nebo v Django nastav STATIC_URL (neobvyklé).
#
# Po `python manage.py collectstatic` jsou soubory ve STATIC_ROOT (v projektu backend/staticfiles/).

server {
    listen 443 ssl;
    server_name new.drevakcup.cz;

    root /root/drevakcup/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|admin) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vlajky a zbytek collectstatic — musí odpovídat cestám v JSON (flag_url), typicky /static/team_flags/…
    location /static/ {
        alias /root/drevakcup/backend/staticfiles/;
    }

    # Nahrané týmové vlajky (MEDIA)
    location /media/ {
        alias /root/drevakcup/backend/media/;
    }
}
